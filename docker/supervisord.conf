[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:backend]
# Single worker required: Qlib uses global state, LightGBM models loaded in-process
command=uvicorn app.main:app --host 0.0.0.0 --port 8015 --workers 1 --loop uvloop --timeout-keep-alive 30
directory=/app/backend
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=30
stopsignal=TERM

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
